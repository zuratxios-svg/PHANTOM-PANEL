<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Phantom Panel - Bảng Điều Khiển</title>
  <!-- Tải Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phông chữ Inter hỗ trợ tiếng Việt sắc nét -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Thiết lập font mặc định, nền đen sâu và chống cuộn ngang */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #050505;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Hiệu ứng gợn sóng trắng neon cho nút "Chạm để mở" */
    @keyframes pulseRing {
      0% {
        transform: scale(0.96);
        opacity: 0.75;
      }
      70% {
        transform: scale(1.18);
        opacity: 0;
      }
      100% {
        transform: scale(1.18);
        opacity: 0;
      }
    }

    .pulse-ring::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      animation: pulseRing 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      pointer-events: none;
    }

    /* Khung Icon App ô vuông bo góc viền trắng neon */
    .app-icon-box {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(145deg, #161616, #080808);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 0 26px rgba(255, 255, 255, 0.25),
        inset 0 0 14px rgba(255, 255, 255, 0.1);
    }

    /* Chuyển cảnh mượt mà bằng opacity (không zoom màn hình) */
    .splash-screen {
      transition: opacity 0.45s ease, visibility 0.45s ease;
      opacity: 1;
      visibility: visible;
    }

    .splash-screen.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-overlay {
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .menu-overlay.menu-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-overlay.menu-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Thẻ chức năng kính mờ trong suốt nhìn xuyên qua các hạt bóng trắng */
    .feature-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .feature-card.is-active {
      background: rgba(255, 255, 255, 0.085);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.18),
        inset 0 0 12px rgba(255, 255, 255, 0.06);
    }

    .feature-card.is-active .icon-svg {
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9));
    }

    /* Công tắc tròn trượt ngang (Pill Switch) chống co bóp trên mobile */
    .toggle-track {
      position: relative;
      flex-shrink: 0;
      width: 52px;
      height: 28px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      transition: background-color 0.32s ease, border-color 0.32s ease, box-shadow 0.32s ease;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 19px;
      height: 19px;
      border-radius: 9999px;
      background-color: #9ca3af;
      transition: transform 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Trạng thái BẬT: Trượt từ trái qua phải + to dần + phát sáng neon trắng */
    .feature-card.is-active .toggle-track {
      background: rgba(255, 255, 255, 0.22);
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.55);
    }

    .feature-card.is-active .toggle-thumb {
      transform: translateX(24px) scale(1.16);
      background-color: #ffffff;
      box-shadow:
        0 0 10px #ffffff,
        0 0 20px rgba(255, 255, 255, 0.9);
    }

    /* Hiệu ứng ánh sáng quét ngang cho nút START PANEL */
    @keyframes sheenSweep {
      0% {
        transform: translateX(-140%) skewX(-20deg);
      }
      55%, 100% {
        transform: translateX(260%) skewX(-20deg);
      }
    }

    .start-panel-btn {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow:
        0 0 22px rgba(255, 255, 255, 0.28),
        inset 0 0 14px rgba(255, 255, 255, 0.12);
      transition: transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease;
    }

    .start-panel-btn:active {
      transform: scale(0.98);
    }

    .start-panel-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      animation: sheenSweep 3.2s infinite ease-in-out;
      pointer-events: none;
    }

    /* Vòng xoay loading neon trong Modal */
    @keyframes spinNeon {
      to {
        transform: rotate(360deg);
      }
    }

    .neon-spinner {
      width: 46px;
      height: 46px;
      border-radius: 9999px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.65);
      animation: spinNeon 0.85s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen w-full select-none antialiased">

  <!-- =========================================================
       1. MÀN HÌNH KHỞI ĐẦU (SPLASH / LOGIN SCREEN)
  ========================================================== -->
  <main id="splashScreen" class="splash-screen fixed inset-0 z-30 bg-[#050505] flex flex-col items-center justify-center px-6">
    <!-- Ánh sáng nền nhẹ sau logo -->
    <div class="absolute w-72 h-72 rounded-full bg-white/[0.04] blur-[90px] pointer-events-none"></div>

    <div class="relative z-10 flex flex-col items-center text-center max-w-xs w-full">
      <!-- Icon App ô vuông bo góc viền trắng neon chứa ảnh JPEG Base64 -->
      <div class="app-icon-box mb-7 flex items-center justify-center p-1.5">
        <img
          id="appLogoImg"
          alt="Phantom Panel Icon"
          class="w-full h-full object-cover rounded-[17px]"
        />
      </div>

      <!-- Tiêu đề gọn gàng -->
      <h1 class="text-xl sm:text-2xl font-bold tracking-wider uppercase text-white drop-shadow-[0_0_12px_rgba(255,255,255,0.45)]">
        PHANTOM PANEL
      </h1>
      <p class="mt-1.5 mb-8 text-xs text-neutral-400 tracking-widest uppercase">
       PANEL SUPPORT GAME FFVN
      </p>

      <!-- Nút bấm trung tâm "CHẠM ĐỂ MỞ" -->
      <button
        id="openMenuBtn"
        type="button"
        aria-label="Chạm để mở bảng điều khiển"
        class="pulse-ring relative group w-full max-w-[250px] py-4 px-7 rounded-full bg-[#0d0d0d] hover:bg-white text-white hover:text-black font-semibold text-sm tracking-[0.15em] uppercase border border-white/85 shadow-[0_0_22px_rgba(255,255,255,0.3)] hover:shadow-[0_0_32px_rgba(255,255,255,0.8)] transition-all duration-300 cursor-pointer flex items-center justify-center gap-3"
      >
        <span class="w-2.5 h-2.5 rounded-full bg-white group-hover:bg-black shadow-[0_0_10px_#ffffff] transition-colors"></span>
        <span>CHẠM ĐỂ MỞ</span>
      </button>
    </div>
  </main>

  <!-- =========================================================
       2. MENU TOÀN MÀN HÌNH (FULLSCREEN MENU - TRONG SUỐT)
  ========================================================== -->
  <section
    id="fullMenu"
    aria-hidden="true"
    class="menu-overlay menu-hidden fixed inset-0 z-20 w-full h-full bg-[#050505] overflow-y-auto"
  >
    <!-- Canvas hiệu ứng hạt bóng trắng nhỏ phát sáng trôi lơ lửng khắp menu -->
    <canvas id="orbsCanvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Khung nội dung chính -->
    <div class="relative z-10 min-h-full w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 flex flex-col justify-between gap-5">

      <!-- Thanh tiêu đề trên cùng (Tối giản, không nút X, không nút âm thanh, không nút tắt tất cả) -->
      <header class="flex items-center justify-between pb-3.5 border-b border-white/10">
        <div>
          <h2 class="text-lg sm:text-xl font-bold text-white tracking-tight drop-shadow-[0_0_10px_rgba(255,255,255,0.35)]">
            PHANTOM PANEL
          </h2>
          <p class="text-xs text-neutral-400 mt-0.5">
            Đã kích hoạt <span id="activeCount" class="text-white font-semibold drop-shadow-[0_0_6px_rgba(255,255,255,0.8)]">0</span> / 8 chức năng
          </p>
        </div>

        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/[0.04] backdrop-blur-md border border-white/20">
          <span class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_#ffffff]"></span>
          <span class="text-[11px] font-semibold tracking-wider uppercase text-neutral-200">Online</span>
        </div>
      </header>

      <!-- Danh sách 8 Chức Năng Kính Mờ Trong Suốt -->
      <div id="featuresGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Render tự động bằng JS -->
      </div>

      <!-- Khu vực nút START PANEL bên dưới danh sách 8 chức năng -->
      <div class="pt-2 pb-4 flex flex-col items-center gap-2.5">
        <button
          id="startPanelBtn"
          type="button"
          class="start-panel-btn w-full py-4 px-6 rounded-2xl text-white font-bold text-sm sm:text-base tracking-[0.18em] uppercase flex items-center justify-center gap-3 cursor-pointer"
        >
          <svg class="w-5 h-5 drop-shadow-[0_0_6px_rgba(255,255,255,0.9)]" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <span>START PANEL</span>
        </button>

        <p id="toastStatus" class="text-xs text-neutral-400 text-center">
          © MAKE BY ZURAT
        </p>
      </div>
    </div>
  </section>

  <!-- =========================================================
       3. HỘP THOẠI CHỜ 2 GIÂY KHI BẤM START PANEL
  ========================================================== -->
  <div
    id="launchModal"
    aria-hidden="true"
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center px-6 opacity-0 pointer-events-none transition-opacity duration-300"
  >
    <div class="w-full max-w-xs rounded-3xl bg-white/[0.06] backdrop-blur-xl border border-white/30 shadow-[0_0_35px_rgba(255,255,255,0.2)] p-7 flex flex-col items-center text-center">
      <div class="neon-spinner mb-5"></div>
      <h3 class="text-base font-bold text-white tracking-wide">
        Đang khởi chạy Panel...
      </h3>
      <p id="countdownText" class="mt-2 text-xs sm:text-sm text-neutral-300 leading-relaxed">
        Vui lòng chờ <span class="text-white font-bold">2</span> giây để mở Free Fire VN
      </p>
      <!-- Thanh tiến trình 2 giây -->
      <div class="w-full h-1.5 bg-white/10 rounded-full overflow-hidden mt-5">
        <div id="launchProgressBar" class="h-full w-0 bg-white shadow-[0_0_10px_#ffffff] transition-all duration-[2000ms] ease-linear"></div>
      </div>
    </div>
  </div>

    // =========================================================
    // 3. HIỆU ỨNG HẠT BÓNG TRẮNG NHỎ LƠ LỬNG KHẮP MENU
    // =========================================================
    const ctx = orbsCanvas.getContext('2d');
    let orbs = [];

    function resizeOrbsCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      orbsCanvas.width = window.innerWidth * dpr;
      orbsCanvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initOrbs() {
      resizeOrbsCanvas();
      const width = window.innerWidth;
      const height = window.innerHeight;
      const count = Math.max(40, Math.min(68, Math.floor((width * height) / 13000)));
      orbs = [];

      for (let i = 0; i < count; i++) {
        orbs.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: 1.5 + Math.random() * 2.8,
          vx: (Math.random() - 0.5) * 0.42,
          vy: -0.15 - Math.random() * 0.4,
          baseAlpha: 0.35 + Math.random() * 0.55,
          pulseSpeed: 0.015 + Math.random() * 0.025,
          pulsePhase: Math.random() * Math.PI * 2
        });
      }
    }

    function animateOrbs() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < orbs.length; i++) {
        const orb = orbs[i];
        orb.x += orb.vx;
        orb.y += orb.vy;
        orb.pulsePhase += orb.pulseSpeed;

        if (orb.x < -12) orb.x = width + 12;
        if (orb.x > width + 12) orb.x = -12;
        if (orb.y < -12) orb.y = height + 12;
        if (orb.y > height + 12) orb.y = -12;

        const alpha = Math.max(0.18, Math.min(0.95, orb.baseAlpha + Math.sin(orb.pulsePhase) * 0.22));
        const glowRadius = orb.radius * 3.5;

        const gradient = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, glowRadius);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        gradient.addColorStop(0.4, `rgba(255, 255, 255, ${alpha * 0.42})`);
        gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.beginPath();
        ctx.arc(orb.x, orb.y, glowRadius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.radius * 0.65, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, alpha + 0.2)})`;
        ctx.fill();
      }

      requestAnimationFrame(animateOrbs);
    }

    window.addEventListener('resize', resizeOrbsCanvas);

    // 4. ÂM THANH POP-CLICK GỌN NẢY, TRONG TRẺO (WEB AUDIO API)
    // =========================================================
    let audioCtx = null;

    function playCrystalSound(isTurnOn) {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        const popOsc = audioCtx.createOscillator();
        const popGain = audioCtx.createGain();
        popOsc.type = 'sine';

        if (isTurnOn) {
          popOsc.frequency.setValueAtTime(560, now);
          popOsc.frequency.exponentialRampToValueAtTime(1260, now + 0.04);
        } else {
          popOsc.frequency.setValueAtTime(920, now);
          popOsc.frequency.exponentialRampToValueAtTime(430, now + 0.04);
        }

        popGain.gain.setValueAtTime(0.001, now);
        popGain.gain.linearRampToValueAtTime(0.65, now + 0.004);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);

        popOsc.connect(popGain);
        popGain.connect(audioCtx.destination);
        popOsc.start(now);
        popOsc.stop(now + 0.058);

        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();
        clickOsc.type = 'triangle';
        clickOsc.frequency.setValueAtTime(isTurnOn ? 2400 : 1850, now);
        clickOsc.frequency.exponentialRampToValueAtTime(600, now + 0.012);

        clickGain.gain.setValueAtTime(0.3, now);
        clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);
        clickOsc.start(now);
        clickOsc.stop(now + 0.017);
      } catch (e) {
        // Bỏ qua nếu trình duyệt hạn chế âm thanh
      }
    }

    function renderFeatures() {

        card.setAttribute('aria-checked', String(isActive));
        card.setAttribute('tabindex', '0');

        card.className = `feature-card ${isActive ? 'is-active' : ''} rounded-2xl p-3.5 sm:p-4 flex items-center justify-between gap-3 cursor-pointer`;

        card.innerHTML = `

                ${feature.icon}

            </div>

                isActive ? 'text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.65)]' : 'text-neutral-100'

                isActive ? 'text-white/90 font-medium' : 'text-neutral-400'
              }">
                ${isActive ? 'Đang bật • ' + feature.desc : feature.desc}
              </p>
            </div>
          </div>

          <div class="toggle-track" aria-hidden="true">
            <div class="toggle-thumb"></div>
          </div>
        `;

        card.addEventListener('click', () => toggleFeature(feature.id));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleFeature(feature.id);
          }
        });

        featuresGrid.appendChild(card);
      });

      updateCounter();
    }

    function toggleFeature(id) {
      const nextValue = !state.toggles[id];
      state.toggles[id] = nextValue;

      const feature = FEATURES.find((f) => f.id === id);
      const card = document.getElementById(`card-${id}`);

      if (card && feature) {
        card.setAttribute('aria-checked', String(nextValue));
        card.classList.toggle('is-active', nextValue);

        const iconBox = card.querySelector('.icon-box');
        const titleEl = card.querySelector('h3');
        const statusLabel = card.querySelector('.status-label');

        if (nextValue) {
          iconBox.className = 'icon-box flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-300 bg-white/20 text-white border border-white/75 shadow-[0_0_14px_rgba(255,255,255,0.45)]';
          titleEl.className = 'text-sm sm:text-base font-semibold truncate transition-colors duration-300 text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.65)]';
          statusLabel.className = 'status-label text-xs mt-0.5 truncate transition-colors duration-300 text-white/90 font-medium';
          statusLabel.textContent = `Đang bật • ${feature.desc}`;
        } else {
          iconBox.className = 'icon-box flex-shrink-0 w-11 h-11 rounded-xl flex items-center justify-center transition-all duration-300 bg-white/[0.04] text-neutral-300 border border-white/14';
          titleEl.className = 'text-sm sm:text-base font-semibold truncate transition-colors duration-300 text-neutral-100';
          statusLabel.className = 'status-label text-xs mt-0.5 truncate transition-colors duration-300 text-neutral-400';
          statusLabel.textContent = feature.desc;
        }

        toastStatusEl.textContent = `${feature.title}: ${nextValue ? 'Đã bật' : 'Đã tắt'}`;
        toastStatusEl.className = nextValue
          ? 'text-xs text-white font-medium text-center drop-shadow-[0_0_6px_rgba(255,255,255,0.5)]'
          : 'text-xs text-neutral-400 text-center';
      }

      playCrystalSound(nextValue);
      updateCounter();
    }

    function updateCounter() {
      const count = Object.values(state.toggles).filter(Boolean).length;
      activeCountEl.textContent = count;
    }

    // =========================================================
    // 6. MỞ MENU TỪ MÀN HÌNH LOGIN
    // =========================================================
    function openMenu() {
      state.isMenuOpen = true;
      splashScreen.classList.add('splash-hidden');
      fullMenu.classList.remove('menu-hidden');
      fullMenu.classList.add('menu-visible');
      fullMenu.setAttribute('aria-hidden', 'false');
      playCrystalSound(true);
    }

    openMenuBtn.addEventListener('click', openMenu);

    // =========================================================
    // 7. XỬ LÝ NÚT START PANEL -> CHỜ 2S -> MỞ FREE FIRE VN
    // =========================================================
    function handleStartPanel() {
      if (state.isLaunching) return;
      state.isLaunching = true;

      playCrystalSound(true);

      launchModal.classList.remove('opacity-0', 'pointer-events-none');
      launchModal.setAttribute('aria-hidden', 'false');

      launchProgressBar.style.transition = 'none';
      launchProgressBar.style.width = '0%';
      void launchProgressBar.offsetWidth;
      launchProgressBar.style.transition = 'width 2000ms linear';
      launchProgressBar.style.width = '100%';

      let secondsLeft = 2;
      countdownText.innerHTML = `Vui lòng chờ <span class="text-white font-bold">${secondsLeft}</span> giây để mở Free Fire VN`;

      const timer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft > 0) {
          countdownText.innerHTML = `Vui lòng chờ <span class="text-white font-bold">${secondsLeft}</span> giây để mở Free Fire VN`;
        } else {
          clearInterval(timer);
          countdownText.innerHTML = `Đang chuyển hướng vào <span class="text-white font-bold">Free Fire VN</span>...`;
        }
      }, 1000);

      setTimeout(() => {
        window.location.href = 'freefirevn://';

        setTimeout(() => {
          toastStatusEl.textContent = 'Đã gửi lệnh mở Free Fire VN (freefirevn://)';
          launchModal.classList.add('opacity-0', 'pointer-events-none');
          launchModal.setAttribute('aria-hidden', 'true');
          state.isLaunching = false;
        }, 800);
      }, 2000);
    }

    startPanelBtn.addEventListener('click', handleStartPanel);

    // Khởi tạo giao diện & hiệu ứng nền
    renderFeatures();
    initOrbs();
    animateOrbs();
  </script>
</body>
</html>
